services:
  postgres:
    ports: ["127.0.0.1:15432:5432"]
  nats:
    ports: ["127.0.0.1:14222:4222"]
  rustfs:
    # Tests' sandboxes reach this store at host.docker.internal. On Linux
    # that is the bridge gateway, which a port on 127.0.0.1 does not answer,
    # so CI publishes it on every address.
    ports: ["${STACKWRIGHT_TEST_S3_BIND:-127.0.0.1}:19000:9000"]
  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.2@sha256:94d4ebf0fe793a727b3468b846e92ccbcd513f3b359a095802d817934d762e01
    environment:
      SERVER_PORT: "18071"
    ports: ["127.0.0.1:18071:18071"]
