syntax = "proto3";

package stackwright.v1;

import "google/protobuf/timestamp.proto";
import "stackwright/v1/orgs.proto";

service AuthService {
  rpc GetSetup(GetSetupRequest) returns (GetSetupResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc CompleteSetup(CompleteSetupRequest) returns (CompleteSetupResponse);
  rpc SignIn(SignInRequest) returns (SignInResponse);
  rpc SignOut(SignOutRequest) returns (SignOutResponse);
  rpc GetMe(GetMeRequest) returns (GetMeResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListSignInProviders(ListSignInProvidersRequest) returns (ListSignInProvidersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc GetInvite(GetInviteRequest) returns (GetInviteResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc AcceptInvite(AcceptInviteRequest) returns (AcceptInviteResponse);
  // The device flow of `stackwright login` (adr/0044).
  rpc GetDevice(GetDeviceRequest) returns (GetDeviceResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ApproveDevice(ApproveDeviceRequest) returns (ApproveDeviceResponse);
  rpc DenyDevice(DenyDeviceRequest) returns (DenyDeviceResponse);
  rpc ListCliTokens(ListCliTokensRequest) returns (ListCliTokensResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc RevokeCliToken(RevokeCliTokenRequest) returns (RevokeCliTokenResponse);
}

message GetSetupRequest {}

message GetSetupResponse {
  bool needed = 1;
}

message CompleteSetupRequest {
  string setup_code = 1;
  string org_name = 2;
  string org_slug = 3;
  string email = 4;
  string name = 5;
  string password = 6;
}

message CompleteSetupResponse {
  string org_slug = 1;
}

message SignInRequest {
  string email = 1;
  string password = 2;
}

message SignInResponse {}

message SignOutRequest {}

message SignOutResponse {}

message GetMeRequest {}

message GetMeResponse {
  User user = 1;
  repeated OrgMembership orgs = 2;
}

message User {
  string id = 1;
  string email = 2;
  string name = 3;
  bool instance_admin = 4;
}

message OrgMembership {
  string slug = 1;
  string name = 2;
  Role role = 3;
  // The org needs a sign-in through its identity provider, and this
  // session has none: its pages send the user there (adr/0045).
  bool needs_sso = 4;
}

message ListSignInProvidersRequest {}

message ListSignInProvidersResponse {
  repeated SignInProviderButton providers = 1;
}

message SignInProviderButton {
  string id = 1;
  string name = 2;
}

message GetInviteRequest {
  string token = 1;
}

message GetInviteResponse {
  string org_name = 1;
  string email = 2;
  Role role = 3;
  bool has_account = 4;
}

message AcceptInviteRequest {
  string token = 1;
  string name = 2;
  string password = 3;
}

message AcceptInviteResponse {
  string org_slug = 1;
}

message GetDeviceRequest {
  string user_code = 1;
}

message GetDeviceResponse {
  // The machine name the CLI sent.
  string name = 1;
  google.protobuf.Timestamp created_at = 2;
}

message ApproveDeviceRequest {
  string user_code = 1;
}

message ApproveDeviceResponse {}

message DenyDeviceRequest {
  string user_code = 1;
}

message DenyDeviceResponse {}

message CliToken {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp last_used_at = 4;
}

message ListCliTokensRequest {}

message ListCliTokensResponse {
  repeated CliToken tokens = 1;
}

message RevokeCliTokenRequest {
  string id = 1;
}

message RevokeCliTokenResponse {}
