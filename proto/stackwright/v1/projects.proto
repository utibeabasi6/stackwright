syntax = "proto3";

package stackwright.v1;

import "google/protobuf/timestamp.proto";

service ProjectService {
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc GetWorkspace(GetWorkspaceRequest) returns (GetWorkspaceResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc CreateSampleProject(CreateSampleProjectRequest) returns (CreateSampleProjectResponse);
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse);
  rpc ArchiveProject(ArchiveProjectRequest) returns (ArchiveProjectResponse);
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (CreateWorkspaceResponse);
  rpc ArchiveWorkspace(ArchiveWorkspaceRequest) returns (ArchiveWorkspaceResponse);
  rpc UpdateWorkspace(UpdateWorkspaceRequest) returns (UpdateWorkspaceResponse);
  // ListEngineVersions lists an engine's stable releases that Stackwright
  // supports, newest first.
  rpc ListEngineVersions(ListEngineVersionsRequest) returns (ListEngineVersionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message ListEngineVersionsRequest {
  Engine engine = 1;
}

message ListEngineVersionsResponse {
  repeated string versions = 1;
}

enum Engine {
  ENGINE_UNSPECIFIED = 0;
  ENGINE_OPENTOFU = 1;
  ENGINE_TERRAFORM = 2;
}

enum Layout {
  LAYOUT_UNSPECIFIED = 0;
  LAYOUT_PLAIN = 1;
  LAYOUT_CLI_WORKSPACES = 2;
  // A folder of Terragrunt units that run in dependency order, on the
  // backend their remote_state names (adr/0041).
  LAYOUT_TERRAGRUNT = 3;
}

// StateBackend says where a project's state lives (adr/0036).
enum StateBackend {
  STATE_BACKEND_UNSPECIFIED = 0;
  // Stackwright's own state service, which runs reach through an override.
  STATE_BACKEND_STACKWRIGHT = 1;
  // The backend block in the code, such as S3; runs use it as written.
  STATE_BACKEND_CODE = 2;
  // A state file committed to Git. Runs plan from it and never apply.
  STATE_BACKEND_GIT = 3;
}

message Project {
  string slug = 1;
  string path = 2;
  Engine engine = 3;
  string engine_version = 4;
  Layout layout = 5;
  string repo_url = 6;
  string branch = 7;
  bool sample = 8;
  repeated Workspace workspaces = 9;
  google.protobuf.Timestamp created_at = 10;
  // The repository as "owner/name", when a linked GitHub installation
  // covers it. Its runs plan run_branch, the project's branch or the
  // repository's default one.
  string linked_repo = 11;
  string run_branch = 12;
  map<string, string> labels = 13;
  StateBackend state_backend = 14;
}

message Workspace {
  string name = 1;
  google.protobuf.Timestamp created_at = 2;
  // An apply starts after a plan with changes, with no approval.
  bool auto_apply = 3;
  // A run goes only to a build server that has every one of these labels.
  map<string, string> required_labels = 4;
  // The cloud account's name, or empty.
  string cloud_account = 5;
}

message ListProjectsRequest {
  string org = 1;
}

message ListProjectsResponse {
  repeated Project projects = 1;
}

message GetWorkspaceRequest {
  string org = 1;
  string project = 2;
  string workspace = 3;
}

message GetWorkspaceResponse {
  Project project = 1;
  Workspace workspace = 2;
}

message CreateProjectRequest {
  string org = 1;
  string slug = 2;
  string path = 3;
  Engine engine = 4;
  string engine_version = 5;
  Layout layout = 6;
  repeated string workspaces = 7;
  string repo_url = 8;
  string branch = 9;
  // A cloud account for every workspace the project starts with, or empty.
  string cloud_account = 10;
  map<string, string> labels = 11;
  // Unspecified means Stackwright's state.
  StateBackend state_backend = 12;
}

message CreateProjectResponse {
  Project project = 1;
}

message CreateSampleProjectRequest {
  string org = 1;
}

message CreateSampleProjectResponse {
  Project project = 1;
}

message UpdateProjectRequest {
  string org = 1;
  string project = 2;
  string path = 3;
  string engine_version = 4;
  string repo_url = 5;
  string branch = 6;
  // Unset keeps the labels.
  Labels labels = 7;
}

message UpdateProjectResponse {
  Project project = 1;
}

message ArchiveProjectRequest {
  string org = 1;
  string project = 2;
}

message ArchiveProjectResponse {}

message CreateWorkspaceRequest {
  string org = 1;
  string project = 2;
  string name = 3;
}

message CreateWorkspaceResponse {
  Workspace workspace = 1;
}

message ArchiveWorkspaceRequest {
  string org = 1;
  string project = 2;
  string workspace = 3;
}

message ArchiveWorkspaceResponse {}

message UpdateWorkspaceRequest {
  string org = 1;
  string project = 2;
  string workspace = 3;
  optional bool auto_apply = 4;
  Labels required_labels = 5;
}

// Labels wraps a map, so an update can tell "no change" from "none".
message Labels {
  map<string, string> values = 1;
}

message UpdateWorkspaceResponse {}
