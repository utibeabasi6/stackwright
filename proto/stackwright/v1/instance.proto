syntax = "proto3";

package stackwright.v1;

service InstanceService {
  rpc ListSignInProviderSettings(ListSignInProviderSettingsRequest) returns (ListSignInProviderSettingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc CreateSignInProvider(CreateSignInProviderRequest) returns (CreateSignInProviderResponse);
  rpc DeleteSignInProvider(DeleteSignInProviderRequest) returns (DeleteSignInProviderResponse);
}

enum SignInProviderKind {
  SIGN_IN_PROVIDER_KIND_UNSPECIFIED = 0;
  SIGN_IN_PROVIDER_KIND_OIDC = 1;
  SIGN_IN_PROVIDER_KIND_GITHUB = 2;
}

message SignInProvider {
  string id = 1;
  SignInProviderKind kind = 2;
  string name = 3;
  string issuer = 4;
  string client_id = 5;
  string callback_url = 6;
}

message ListSignInProviderSettingsRequest {}

message ListSignInProviderSettingsResponse {
  repeated SignInProvider providers = 1;
}

message CreateSignInProviderRequest {
  SignInProviderKind kind = 1;
  string name = 2;
  string issuer = 3;
  string client_id = 4;
  string client_secret = 5;
}

message CreateSignInProviderResponse {
  SignInProvider provider = 1;
}

message DeleteSignInProviderRequest {
  string id = 1;
}

message DeleteSignInProviderResponse {}
