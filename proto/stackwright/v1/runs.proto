syntax = "proto3";

package stackwright.v1;

import "google/protobuf/timestamp.proto";
import "stackwright/v1/security.proto";

service RunService {
  rpc CreateRun(CreateRunRequest) returns (CreateRunResponse);
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc GetRun(GetRunRequest) returns (GetRunResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // WatchRun sends every event after after_seq, then each new one as it
  // happens, and the run again whenever it changes.
  rpc WatchRun(WatchRunRequest) returns (stream WatchRunResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ApproveRun(ApproveRunRequest) returns (ApproveRunResponse);
  rpc RejectRun(RejectRunRequest) returns (RejectRunResponse);
  rpc CancelRun(CancelRunRequest) returns (CancelRunResponse);
  rpc ListWaiting(ListWaitingRequest) returns (ListWaitingResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_QUEUED = 1;
  RUN_STATUS_PLANNING = 2;
  RUN_STATUS_NEEDS_APPROVAL = 3;
  RUN_STATUS_APPLYING = 4;
  RUN_STATUS_PLANNED = 5;
  RUN_STATUS_APPLIED = 6;
  RUN_STATUS_FAILED = 7;
  RUN_STATUS_REJECTED = 8;
  RUN_STATUS_CANCELED = 9;
  // A High or Critical finding on what the plan changes holds the apply
  // until someone accepts the risk (adr/0037).
  RUN_STATUS_BLOCKED = 10;
}

message Run {
  string id = 1;
  int32 number = 2;
  string project = 3;
  string workspace = 4;
  RunStatus status = 5;
  bool plan_only = 6;
  // Where the code came from, such as "sample" or an uploaded file's name.
  string source = 7;
  string source_sha256 = 8;
  bool has_changes = 9;
  int32 adds = 10;
  int32 changes = 11;
  int32 destroys = 12;
  string error = 13;
  string created_by = 14;
  string decided_by = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp updated_at = 17;
  google.protobuf.Timestamp finished_at = 18;
  // The run's last event, for a reader that resumes.
  int64 last_seq = 19;
  // The build server of the run's latest job.
  string build_server = 20;
  // "ui", "pull_request" or "push".
  string trigger = 21;
  string commit_sha = 22;
  int32 pr_number = 23;
  string branch = 24;
  // The repository as "owner/name".
  string repo = 25;
}

message RunEvent {
  int64 seq = 1;
  string type = 2;
  string resource_addr = 3;
  // JSON.
  string payload = 4;
  google.protobuf.Timestamp at = 5;
  string actor = 6;
  // The timeline's line for the event, the same in the web app and the
  // CLI (adr/0044). tone is "ok", "warn", "error", "muted" or empty; fix
  // is what to send the agent about an error.
  string text = 7;
  string tone = 8;
  string detail = 9;
  string fix = 10;
}

message CreateRunRequest {
  string org = 1;
  string project = 2;
  string workspace = 3;
  bool plan_only = 4;
  // A .tar.gz of the project's repository. Empty runs the sample project's
  // code, for the sample project only.
  bytes source = 5;
  string source_name = 6;
  // Plan the code the workspace last applied, to undo drift (adr/0042).
  bool revert = 7;
  // A drift check now: a refresh-only plan of the code last applied.
  bool check_drift = 8;
  // A plan of an upload from the CLI, which never applies, on any project
  // (adr/0044).
  bool speculative = 9;
}

message CreateRunResponse {
  Run run = 1;
}

message ListRunsRequest {
  string org = 1;
  string project = 2;
  string workspace = 3;
}

message ListRunsResponse {
  repeated Run runs = 1;
}

message GetRunRequest {
  string org = 1;
  string project = 2;
  string workspace = 3;
  int32 number = 4;
}

message GetRunResponse {
  Run run = 1;
}

message WatchRunRequest {
  string org = 1;
  string project = 2;
  string workspace = 3;
  int32 number = 4;
  int64 after_seq = 5;
}

message WatchRunResponse {
  repeated RunEvent events = 1;
  // Set when the run changed.
  Run run = 2;
}

message ApproveRunRequest {
  string org = 1;
  string project = 2;
  string workspace = 3;
  int32 number = 4;
}

message ApproveRunResponse {
  Run run = 1;
}

message RejectRunRequest {
  string org = 1;
  string project = 2;
  string workspace = 3;
  int32 number = 4;
}

message RejectRunResponse {
  Run run = 1;
}

message CancelRunRequest {
  string org = 1;
  string project = 2;
  string workspace = 3;
  int32 number = 4;
}

message CancelRunResponse {
  Run run = 1;
}

message ListWaitingRequest {
  string org = 1;
}

message ListWaitingResponse {
  // Runs that need an approval the caller may give, then runs whose
  // workspace's latest run failed.
  repeated Run approvals = 1;
  repeated Run failures = 2;
  // Open High and Critical findings that no one accepted, for those who
  // may accept them.
  repeated Finding findings = 3;
  // Open drift findings, for writers and above (adr/0042).
  repeated Finding drift = 4;
  // Deployment runs that wait for an approval the caller may give.
  repeated WaitingDeployment deployments = 5;
}

message WaitingDeployment {
  string name = 1;
  int32 number = 2;
  google.protobuf.Timestamp since = 3;
}
