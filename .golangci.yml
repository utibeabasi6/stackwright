version: "2"
linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - nolintlint
    - sloglint
    - unconvert
    - usestdlibvars
  exclusions:
    paths:
      - gen
    rules:
      - path: _test\.go
        linters: [gosec, noctx]
      # Cookies are Secure when the public URL is https, and the CSRF cookie is
      # read by the web app, so it cannot be HttpOnly.
      - linters: [gosec]
        text: G124
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/stackwright/stackwright
