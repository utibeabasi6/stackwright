name: stackwright

x-stackwright-image: &stackwright-image
  build: .
  image: stackwright/stackwright:dev

services:
  stackwright:
    <<: *stackwright-image
    environment:
      STACKWRIGHT_APP_DB_PASSWORD_FILE: /run/secrets/app_db_password
      STACKWRIGHT_KEK_FILE: /run/secrets/kek
      STACKWRIGHT_S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      STACKWRIGHT_S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      STACKWRIGHT_NATS_PASSWORD_FILE: /run/secrets/nats_password
      STACKWRIGHT_BUILDER_TOKEN_FILE: /run/secrets/builder_token
      STACKWRIGHT_PUBLIC_URL: ${STACKWRIGHT_PUBLIC_URL:-http://127.0.0.1:8080}
      # Where remote build servers reach the builder port, and the server and
      # S3 for their sandboxes (adr/0021).
      STACKWRIGHT_BUILDER_URL: ${STACKWRIGHT_BUILDER_URL:-https://127.0.0.1:8443}
      STACKWRIGHT_BUILDER_HOSTS: stackwright
      STACKWRIGHT_SANDBOX_URL: ${STACKWRIGHT_SANDBOX_URL:-http://127.0.0.1:8080}
      STACKWRIGHT_S3_PUBLIC_URL: ${STACKWRIGHT_S3_PUBLIC_URL:-http://127.0.0.1:9000}
      STACKWRIGHT_EXECUTOR_IMAGE: ${STACKWRIGHT_EXECUTOR_IMAGE:-stackwright/executor:dev}
      # AWS fetches the token issuer's keys from here; it must be public
      # https. Empty uses STACKWRIGHT_PUBLIC_URL (adr/0022).
      STACKWRIGHT_OIDC_ISSUER: ${STACKWRIGHT_OIDC_ISSUER:-}
      # Empty means github.com (adr/0023).
      STACKWRIGHT_GITHUB_URL: ${STACKWRIGHT_GITHUB_URL:-}
      STACKWRIGHT_GITHUB_API_URL: ${STACKWRIGHT_GITHUB_API_URL:-}
    secrets: [app_db_password, kek, s3_access_key, s3_secret_key, nats_password, builder_token]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rustfs:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      # Plain HTTP. Put a TLS proxy in front before publishing beyond this host.
      - 127.0.0.1:8080:8080
      # TLS from the builder CA, with client certificates. A proxy in front
      # must pass TLS through. Publish it beyond this host for remote build
      # servers.
      - 127.0.0.1:8443:8443
    healthcheck:
      test: ["CMD", "/stackwright", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # The built-in build server. It is the only container with the Docker
  # socket, which is root on this host. It joins the server and RustFS to
  # each sandbox's network (adr/0018).
  builder:
    build:
      context: .
      target: builder
    image: stackwright/builder:dev
    environment:
      STACKWRIGHT_BUILDER_TOKEN_FILE: /run/secrets/builder_token
      STACKWRIGHT_SANDBOX_JOIN: stackwright,rustfs
      STACKWRIGHT_BUILDER_CACHE: /cache
      STACKWRIGHT_SANDBOX_CACHE: stackwright-builder-cache
      STACKWRIGHT_BUILDER_LABELS: ${STACKWRIGHT_BUILDER_LABELS:-}
    secrets: [builder_token]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - builder-cache:/cache
    depends_on:
      stackwright:
        condition: service_healthy
      executor:
        condition: service_completed_successfully
    restart: unless-stopped

  # Builds the sandbox image, then exits.
  executor:
    build:
      context: .
      target: executor
    image: stackwright/executor:dev
    command: ["version"]
    restart: "no"

  migrate:
    <<: *stackwright-image
    command: ["migrate"]
    environment:
      STACKWRIGHT_POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      STACKWRIGHT_APP_DB_PASSWORD_FILE: /run/secrets/app_db_password
    secrets: [postgres_password, app_db_password]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:16.14-alpine
    environment:
      POSTGRES_USER: stackwright
      POSTGRES_DB: stackwright
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "stackwright", "-d", "stackwright"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  nats:
    image: nats:2.15.2-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      NATS_PASSWORD: ${STACKWRIGHT_NATS_PASSWORD:?Run make init to create .env}
    volumes:
      - ./deploy/nats.conf:/etc/nats/nats.conf:ro
      - nats:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${STACKWRIGHT_S3_ACCESS_KEY:?Run make init to create .env}
      RUSTFS_SECRET_KEY: ${STACKWRIGHT_S3_SECRET_KEY:?Run make init to create .env}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
    ports:
      # Remote build servers' sandboxes fetch and upload here by presigned URL.
      - 127.0.0.1:9000:9000
    volumes:
      - rustfs:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

secrets:
  postgres_password:
    environment: STACKWRIGHT_POSTGRES_PASSWORD
  app_db_password:
    environment: STACKWRIGHT_APP_DB_PASSWORD
  kek:
    environment: STACKWRIGHT_KEK
  s3_access_key:
    environment: STACKWRIGHT_S3_ACCESS_KEY
  s3_secret_key:
    environment: STACKWRIGHT_S3_SECRET_KEY
  nats_password:
    environment: STACKWRIGHT_NATS_PASSWORD
  builder_token:
    environment: STACKWRIGHT_BUILDER_TOKEN

volumes:
  postgres:
  nats:
  rustfs:
  builder-cache:
    name: stackwright-builder-cache
